# Mirats / AspireReact — Docker Compose production overlay for Nginx Proxy Manager (NPM).
#
# Final model (internal-only):
#   Browser --HTTPS--> NPM (TLS terminates, Force SSL + HSTS) --HTTP--> mirats-frontend:80
#     --/api + /health--> server:5000 (Mirats internal network only)
#
# Usage:
#   cp .env.example .env
#   # set NPM_NETWORK (existing external NPM network), PROXY_KNOWN_NETWORKS (Mirats + NPM subnets),
#   # CORS_ALLOWED_ORIGINS / WEBAUTHN_RPID / WEBAUTHN_ORIGINS for the internal domain
#   docker compose -f docker-compose.yml -f docker-compose.npm.yml up -d --build
#
# Security properties:
# - ONLY frontend joins the external NPM network; server/postgres/redis/backup stay on the
#   internal Mirats network. NPM can reach mirats-frontend:80, nothing else.
# - No host ports are published by any service (server/frontend !reset; DB/Redis/backup never had).
# - Backend trusts exactly the two proxy layers (Mirats internal + NPM external) via
#   Proxy__KnownNetworks, with ForwardLimit=2, so Request.RemoteIpAddress is the real browser IP.

networks:
  # Internal Mirats network (DB/Redis/API/frontend/backup). Not exposed to the host.
  default:
    name: ${MIRATS_NETWORK:-mirats-internal}
  # Pre-existing NPM network (docker network ls). ONLY frontend joins it.
  npm-external:
    name: ${NPM_NETWORK:?NPM_NETWORK is required — existing external NPM network name}
    external: true

services:
  # Internal only: no NPM attachment, no published port.
  server:
    networks:
      - default
    ports: !reset []
    environment:
      # CSV of BOTH subnets: Mirats internal (immediate peer = frontend) + NPM external
      # (right-most XFF entry added by NPM). Fail-closed: empty means headers are ignored.
      Proxy__KnownNetworks: ${PROXY_KNOWN_NETWORKS:?PROXY_KNOWN_NETWORKS is required — Mirats + NPM CIDRs}
      # 2 proxy hops: NPM -> frontend nginx -> server.
      Proxy__ForwardLimit: ${PROXY_FORWARD_LIMIT:-2}
      # Cloudflare only for a future tunnel setup; keep false for direct NPM.
      Proxy__TrustCloudflare: ${PROXY_TRUST_CLOUDFLARE:-false}
      # Passkeys require the real HTTPS origin (NPM terminates TLS).
      Auth__WebAuthn__RPId: ${WEBAUTHN_RPID:?WEBAUTHN_RPID is required}
      Auth__WebAuthn__Origins: ${WEBAUTHN_ORIGINS:?WEBAUTHN_ORIGINS is required}

  # Joins both networks: reachable by NPM as mirats-frontend:80, and reaches server:5000 internally.
  frontend:
    container_name: mirats-frontend
    networks:
      - default
      - npm-external
    ports: !reset []
