server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # API reverse proxy — same-origin for the browser, no CORS needed in prod.
    # `server` is the compose service name (backend, port 5000).
    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Health passthrough — /api/v1/health is the real prod health endpoint
    # (ServiceDefaults /health + /alive only exist in Development).
    location = /health {
        proxy_pass http://server:5000/api/v1/health;
        proxy_set_header Host $host;
    }

    # SPA fallback — every non-file route serves index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
