server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # [READY GĐ0] Minimal security headers for every response served by Nginx.
    # HSTS is deliberately NOT set here: TLS terminates at Nginx Proxy Manager, which is the
    # only hop that knows the public scheme (see docs/DEPLOYMENT.md §4.5).
    # CSP is deferred to P1 (antd inline styles need a nonce/hash strategy first).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # API reverse proxy — same-origin for the browser, no CORS needed in prod.
    # `server` is the compose service name (backend, port 5000).
    # [REVERSE-PROXY] Preserve the outer X-Forwarded-Proto (https from NPM) instead
    # of overwriting it with our own http scheme — backend Request.Scheme (QR URLs,
    # cookie semantics) depends on it. Neither `map` (http-context only) nor
    # `proxy_set_header` inside `if` (illegal there — crashes nginx, verified
    # 2026-10-15) works in this server-context include, so the conditional goes
    # through a `set` variable instead.
    location /api/ {
        proxy_pass http://server:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # API sets the same headers itself (SecurityHeadersMiddleware) — hide the upstream copies
        # so the browser never receives duplicates (invalid for X-Frame-Options).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        set $xfp $scheme;
        if ($http_x_forwarded_proto != "") {
            set $xfp $http_x_forwarded_proto;
        }
        proxy_set_header X-Forwarded-Proto $xfp;
        proxy_read_timeout 60s;
    }

    # Health passthrough — /api/v1/health is the real prod health endpoint
    # (ServiceDefaults /health + /alive only exist in Development).
    location = /health {
        proxy_pass http://server:5000/api/v1/health;
        proxy_set_header Host $host;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # SPA fallback — every non-file route serves index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        # Any add_header in a location suppresses server-level inheritance → repeat the set.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }
}
