# Preserve the outer proxy's scheme. NPM sends X-Forwarded-Proto (http/https) plus
# X-Forwarded-Scheme (the scheme it terminated). Only fall back to this hop's $scheme when
# the request did not come through a proxy at all — never overwrite NPM's value.
map $http_x_forwarded_proto $mirats_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend upload limit: Kestrel default MaxRequestBodySize is 30,000,000 bytes (~28.6 MiB).
    # 30m (31,457,280 bytes) covers it; nginx's default 1m returned 413 on Excel import.
    client_max_body_size 30m;
    client_body_timeout 300s;

    # [READY GĐ0] Minimal security headers for every response served by Nginx.
    # HSTS is deliberately NOT set here: TLS terminates at Nginx Proxy Manager, which is the
    # only hop that knows the public scheme (see docs/DEPLOYMENT.md §4.5).
    # CSP is deferred to P1 (antd inline styles need a nonce/hash strategy first).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # API reverse proxy — same-origin for the browser, no CORS needed in prod.
    # `server` is the compose service name (backend, port 5000).
    # [NPM 2-layer proxy] Preserve NPM's Host + X-Forwarded-Proto EXACTLY (do not replace with
    # $scheme); forward X-Forwarded-Scheme too (backend fallback when NPM sends XFP=http).
    # X-Forwarded-For is appended, never overwritten.
    location /api/ {
        proxy_pass http://server:5000;
        # HTTP/1.1 so empty POSTs keep a valid framing (HTTP/1.1 POST without
        # Content-Length/Transfer-Encoding is rejected by Kestrel as 400).
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mirats_forwarded_proto;
        proxy_set_header X-Forwarded-Scheme $http_x_forwarded_scheme;
        # API sets the same headers itself (SecurityHeadersMiddleware) — hide the upstream copies
        # so the browser never receives duplicates (invalid for X-Frame-Options).
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        # Excel import can take longer than nginx's 60s default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_body_timeout 300s;
    }

    # Health passthrough — /api/v1/health is the real prod health endpoint
    # (ServiceDefaults /health + /alive only exist in Development).
    location = /health {
        proxy_pass http://server:5000/api/v1/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mirats_forwarded_proto;
        proxy_set_header X-Forwarded-Scheme $http_x_forwarded_scheme;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
    }

    # SPA fallback — every non-file route serves index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        # Any add_header in a location suppresses server-level inheritance → repeat the set.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        try_files $uri =404;
    }
}
