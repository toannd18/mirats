# Mirats / AspireReact — Docker Compose (production)
# Usage:
#   cp .env.example .env      # điền TẤT CẢ biến BẮT BUỘC (không default)
#   docker compose up -d --build
#   # pgAdmin (debug overlay only):
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml up -d pgadmin
#
# Design decisions (DOCKER-1):
# - Aspire AppHost là dev orchestrator — compose này là prod path riêng, không dùng AppHost.
# - Server context = ./aspire-react (khớp AGENTS.md: sln under aspire-react/).
# - Frontend multi-stage Node 20 → Nginx, proxy /api → server:5000 (same-origin, không CORS prod).
# - Redis bật password (REDIS_PASSWORD:?required).
# - pgAdmin nằm ở docker-compose.debug.yml (overlay riêng) — prod không cần PGADMIN_PASSWORD.
# - Volumes đặt tên rõ ràng để `docker compose down -v` / scripts/docker-reset.* dọn sạch.
#
# [FIX-DEPLOY 2026-10-02] Auth là LOCAL (JWT tự ký HS256 + passkey tùy chọn). Keycloak đã bị XÓA
# hoàn toàn ở AUTH Phase 5, nên service `keycloak`, mọi biến `Keycloak__*` và mọi build-arg
# `VITE_KEYCLOAK_*` đã được dọn khỏi file này. Admin đầu tiên do StartupDataSeeder tạo ngay lúc
# server khởi động từ AUTH_BOOTSTRAP_ADMIN_PASSWORD (+ INITIAL_ADMIN_USERNAME/EMAIL) — không cần
# chạy script seed thủ công sau `up`. Đổi AUTH_SIGNING_KEY = vô hiệu mọi access token cũ.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aspire-react-db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
    # Prod: KHÔNG expose 5432 ra host (bảo mật VPS công khai). DB chỉ truy cập trong compose
    # network (server). Khi cần debug từ host (psql, pgAdmin), dùng `docker exec -it
    # <postgres-container> psql ...` hoặc thêm mapping tạm trong một override file cục bộ.
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aspire-react-db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env]
    environment:
      # [READY GĐ2] Explicit for the healthcheck below (`$$REDIS_PASSWORD` inside the container);
      # env_file alone is not guaranteed to carry the interpolated value.
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in .env}
    # REDIS_PASSWORD is BẮT BUỘC prod (DOCKER-1 #3) — compose fails if empty.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required — set it in .env}"]
    # Prod: KHÔNG expose 6379 ra host (như postgres). Debug qua docker exec.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ./aspire-react
      dockerfile: aspire-react.Server/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env]
    environment:
      ASPNETCORE_URLS: ${ASPNETCORE_URLS:-http://+:5000}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      # Derived — DOCKER-2 § "Suy ra" (không bỏ sót):
      ConnectionStrings__aspire-react-db: Host=postgres;Database=${POSTGRES_DB:-aspire-react-db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      ConnectionStrings__cache: redis:6379,password=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      # ---- [FIX-DEPLOY] Local auth (the ONLY auth since AUTH Phase 5) ----
      # Auth__SigningKey: HS256 key ≥ 256 bit. REQUIRED — TokenService/AddAppAuthentication throw
      # without it. Rotating it invalidates every issued access token (refresh tokens survive).
      Auth__SigningKey: ${AUTH_SIGNING_KEY:?AUTH_SIGNING_KEY is required — random HS256 key >= 256 bit}
      Auth__Issuer: ${AUTH_ISSUER:-aspire-react}
      Auth__Audience: ${AUTH_AUDIENCE:-aspire-react-api}
      # First administrator: StartupDataSeeder creates this user on boot when it does not exist
      # yet (fresh database), then seeds its password hash. Idempotent — never overwrites.
      Auth__BootstrapAdminPassword: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?AUTH_BOOTSTRAP_ADMIN_PASSWORD is required — first admin password, no default}
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@localhost}
      # Prod BẮT BUỘC: CORS allowed origins (CSV). Same-origin qua Nginx nên thường chỉ cần domain app.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required — e.g. https://app.example.com}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # [READY GĐ2] HTTP readiness (Postgres + Redis) instead of a bare TCP connect.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/5000 && printf \"GET /api/v1/health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 2
      start_period: 30s

  # Encrypted daily Postgres backup sidecar (official postgres base + age/rsync).
  # Manual run / deploy pre-backup: docker compose run --rm --no-deps backup --once
  backup:
    build:
      context: ./deploy/backup
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-aspire-react-db}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — set it in .env}
      # PUBLIC age key only. The private key must NEVER be copied to the server.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required — age public key (private key stays off the server)}
      BACKUP_SCHEDULE_HOUR: ${BACKUP_SCHEDULE_HOUR:-1}
      BACKUP_SCHEDULE_MINUTE: ${BACKUP_SCHEDULE_MINUTE:-0}
      BACKUP_TIMEZONE: ${BACKUP_TIMEZONE:-Asia/Ho_Chi_Minh}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      # Off-site copy is OFF by default (empty).
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      BACKUP_REMOTE_SSH_KEY: ${BACKUP_REMOTE_SSH_KEY:-}
      BACKUP_STATE_FILE: /backups/last_success
    volumes:
      # Host-visible directory so Zabbix can read /backup-data/last_success.
      - ${BACKUP_HOST_DIR:-./backup-data}:/backups
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./aspire-react/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  postgres-data:
    name: mirats-postgres-data
  redis-data:
    name: mirats-redis-data
